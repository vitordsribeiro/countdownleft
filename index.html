<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem para as 18:30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --sky-top: #180d30;
    --sky-mid: #4a2a5e;
    --sky-low: #a8456b;
    --sky-horizon: #ff8a5c;
    --gold: #f2c14e;
    --cream: #fdf3e7;
    --muted: #cdb9db;
    --silhouette: #120a1f;
    --silhouette-2: #1c1030;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100dvh;
  }

  body {
    display: flex;
    background: var(--sky-top);
    color: var(--cream);
    font-family: "Work Sans", "Segoe UI", sans-serif;
    overflow-x: hidden;
  }

  .scene {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.1rem, 2.4vh, 1.9rem);
    padding: 6vh 1.5rem 0;
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(255, 216, 170, 0.10), transparent 60%),
      linear-gradient(
        to bottom,
        var(--sky-top) 0%,
        var(--sky-mid) 42%,
        var(--sky-low) 70%,
        var(--sky-horizon) 92%,
        #ffb27c 100%
      );
    text-align: center;
    isolation: isolate;
  }

  .stars {
    position: absolute;
    inset: 0;
    top: 0;
    height: 46%;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 20%, rgba(253, 243, 231, 0.85), transparent),
      radial-gradient(1.5px 1.5px at 28% 44%, rgba(253, 243, 231, 0.6), transparent),
      radial-gradient(1px 1px at 44% 12%, rgba(253, 243, 231, 0.7), transparent),
      radial-gradient(1.5px 1.5px at 63% 30%, rgba(253, 243, 231, 0.5), transparent),
      radial-gradient(1px 1px at 77% 16%, rgba(253, 243, 231, 0.8), transparent),
      radial-gradient(1.5px 1.5px at 91% 38%, rgba(253, 243, 231, 0.6), transparent),
      radial-gradient(1px 1px at 8% 55%, rgba(253, 243, 231, 0.4), transparent),
      radial-gradient(1px 1px at 52% 6%, rgba(253, 243, 231, 0.55), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .eyebrow {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px 1px rgba(242, 193, 78, 0.7);
  }

  h1 {
    position: relative;
    z-index: 2;
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    line-height: 1.15;
    text-wrap: balance;
    color: var(--cream);
  }

  h1 em {
    font-style: italic;
    font-weight: 600;
    color: var(--gold);
  }

  .timer {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: baseline;
    gap: clamp(0.35rem, 1.4vw, 0.9rem);
    font-family: "IBM Plex Mono", "Consolas", monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: clamp(2.8rem, 11vw, 6.5rem);
    color: var(--gold);
    text-shadow: 0 0 34px rgba(242, 193, 78, 0.35);
    line-height: 1;
  }

  .timer .sep {
    font-weight: 400;
    color: rgba(253, 243, 231, 0.5);
    font-size: 0.7em;
    transform: translateY(-0.08em);
  }

  @media (prefers-reduced-motion: no-preference) {
    .timer .sep {
      animation: blink 2s steps(1, end) infinite;
    }
  }

  @keyframes blink {
    50% { opacity: 0.25; }
  }

  .unit-row {
    position: relative;
    z-index: 2;
    display: flex;
    gap: clamp(0.35rem, 1.4vw, 0.9rem);
    font-family: "Work Sans", sans-serif;
    font-size: clamp(0.62rem, 1.4vw, 0.78rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: -0.6rem;
  }

  .unit-row span {
    width: 2.35ch;
    text-align: center;
  }

  .unit-row .sep-space { width: 0.9ch; }

  .now-line {
    position: relative;
    z-index: 2;
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 400;
  }

  .now-line strong {
    color: var(--cream);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    font-family: "IBM Plex Mono", monospace;
  }

  .skyline {
    position: relative;
    z-index: 1;
    width: min(100%, 900px);
    margin-top: clamp(0.5rem, 3vh, 2rem);
  }

  .skyline svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .now-line .now-temp {
    color: var(--gold);
  }

  .weather {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: stretch;
    width: min(100%, 420px);
    margin-top: 0.2rem;
    background: rgba(253, 243, 231, 0.07);
    border: 1px solid rgba(253, 243, 231, 0.18);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    overflow: hidden;
  }

  .weather-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    padding: 1rem 1.2rem;
    min-width: 0;
  }

  .weather-divider {
    width: 1px;
    background: rgba(253, 243, 231, 0.18);
    margin: 1rem 0;
  }

  .weather-day {
    margin: 0;
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .weather-icon svg {
    width: 32px;
    height: 32px;
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .weather-desc {
    margin: 0;
    font-size: 0.8rem;
    color: var(--cream);
  }

  .weather-temps {
    margin: 0;
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--gold);
  }

  .weather-temps .temp-sep {
    color: rgba(253, 243, 231, 0.4);
    font-weight: 400;
    margin: 0 0.3em;
  }

  .weather-status {
    width: 100%;
    padding: 0.9rem 1.2rem;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .route {
    position: relative;
    z-index: 2;
    width: min(100%, 420px);
    margin-top: 0.2rem;
    background: rgba(253, 243, 231, 0.07);
    border: 1px solid rgba(253, 243, 231, 0.18);
    border-radius: 16px;
    backdrop-filter: blur(6px);
    padding: 1.1rem 1.3rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    text-align: left;
  }

  .route-eyebrow {
    margin: 0;
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .route-stop {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.82rem;
    color: var(--cream);
    padding: 0.15rem 0;
  }

  .route-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .route-dot.origin {
    background: var(--gold);
    box-shadow: 0 0 6px 1px rgba(242, 193, 78, 0.6);
  }

  .route-dot.dest {
    background: var(--cream);
  }

  .route-line {
    width: 1px;
    height: 16px;
    background: rgba(253, 243, 231, 0.3);
    margin-left: 3.5px;
  }

  .route-figures {
    display: flex;
    gap: 1.6rem;
    padding-top: 0.35rem;
    border-top: 1px solid rgba(253, 243, 231, 0.12);
  }

  .route-value {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--gold);
    margin-right: 0.35em;
  }

  .route-label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .route-note {
    margin: 0;
    font-size: 0.68rem;
    color: rgba(205, 185, 219, 0.75);
  }

  .route-status {
    margin: 0;
    padding: 0.4rem 0;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  footer {
    position: relative;
    z-index: 2;
    padding: 1.1rem 0 1.4rem;
    font-size: 0.72rem;
    color: rgba(205, 185, 219, 0.7);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="stars"></div>

  <p class="eyebrow">Rio de Janeiro</p>
  <h1>Contagem regressiva até as <em>18:30</em></h1>

  <div class="timer" id="timer" aria-live="polite">
    <span id="hh">00</span><span class="sep">:</span><span id="mm">00</span><span class="sep">:</span><span id="ss">00</span>
  </div>
  <div class="unit-row">
    <span>horas</span><span class="sep-space"></span><span>min</span><span class="sep-space"></span><span>seg</span>
  </div>

  <p class="now-line">Agora no Rio: <strong id="now-clock">--:--:--</strong> <span class="now-temp" id="now-temp"></span></p>

  <div class="weather" id="weather">
    <p class="weather-status">Carregando previsão&hellip;</p>
  </div>

  <div class="route" id="route">
    <p class="route-status">Calculando rota&hellip;</p>
  </div>

  <div class="skyline" aria-hidden="true">
    <svg viewBox="0 0 900 220" preserveAspectRatio="none">
      <path d="M0,220 L0,150 L60,150 L90,120 L120,150 L170,150 L170,220 Z" fill="#1c1030" opacity="0.55"></path>
      <path d="M180,220 C220,190 250,150 300,150 C340,150 350,175 390,175 C420,175 430,150 470,150 C500,150 505,190 540,220 Z" fill="#160b28" opacity="0.85"></path>
      <path d="M556,220 L556,60 L560,50 L564,60 L564,90 L580,90 L580,100 L564,100 L564,150 L610,220 Z" fill="#120a1f"></path>
      <rect x="558" y="30" width="12" height="4" fill="#120a1f"></rect>
      <path d="M600,220 C650,205 680,160 730,160 C770,160 790,190 830,195 C860,199 880,210 900,220 Z" fill="#150a26" opacity="0.9"></path>
      <path d="M0,220 L900,220 L900,235 L0,235 Z" fill="#0f081b"></path>
    </svg>
  </div>

  <footer>Horário de Brasília &mdash; America/Sao_Paulo (UTC&minus;3)</footer>
</div>

<script>
  const TARGET_HOUR = 18;
  const TARGET_MINUTE = 30;
  const RIO_TZ = "America/Sao_Paulo";
  const RIO_OFFSET = "-03:00";

  const hhEl = document.getElementById("hh");
  const mmEl = document.getElementById("mm");
  const ssEl = document.getElementById("ss");
  const nowClockEl = document.getElementById("now-clock");

  const dateFmt = new Intl.DateTimeFormat("en-CA", {
    timeZone: RIO_TZ,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  });

  const clockFmt = new Intl.DateTimeFormat("pt-BR", {
    timeZone: RIO_TZ,
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function getTargetDate(now) {
    const ymd = dateFmt.format(now);
    let target = new Date(`${ymd}T${pad(TARGET_HOUR)}:${pad(TARGET_MINUTE)}:00${RIO_OFFSET}`);
    if (target.getTime() <= now.getTime()) {
      target = new Date(target.getTime() + 24 * 60 * 60 * 1000);
    }
    return target;
  }

  function tick() {
    const now = new Date();
    const target = getTargetDate(now);
    const diff = Math.max(0, target.getTime() - now.getTime());

    const totalSeconds = Math.floor(diff / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    hhEl.textContent = pad(hours);
    mmEl.textContent = pad(minutes);
    ssEl.textContent = pad(seconds);

    nowClockEl.textContent = clockFmt.format(now);
  }

  tick();
  setInterval(tick, 1000);

  const ICONS = {
    sun: '<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="4.93" x2="7.05" y2="7.05"></line><line x1="16.95" y1="16.95" x2="19.07" y2="19.07"></line><line x1="4.93" y1="19.07" x2="7.05" y2="16.95"></line><line x1="16.95" y1="7.05" x2="19.07" y2="4.93"></line>',
    partly: '<circle cx="8" cy="8" r="2.6"></circle><line x1="8" y1="2" x2="8" y2="3.6"></line><line x1="2.6" y1="8" x2="4.2" y2="8"></line><line x1="3.6" y1="3.6" x2="4.7" y2="4.7"></line><path d="M18.5 20H8a4.2 4.2 0 0 1-.6-8.36A6 6 0 0 1 19 10.2 3.8 3.8 0 0 1 18.5 20Z"></path>',
    cloud: '<path d="M18.5 19H7.5a4.5 4.5 0 0 1-.7-8.94A6.2 6.2 0 0 1 19 9.7 3.8 3.8 0 0 1 18.5 19Z"></path>',
    rain: '<path d="M17.5 16H7a4.2 4.2 0 0 1-.6-8.36A6 6 0 0 1 18 6.7 3.8 3.8 0 0 1 17.5 16Z"></path><line x1="8" y1="19" x2="7" y2="22"></line><line x1="12.5" y1="19" x2="11.5" y2="22"></line><line x1="17" y1="19" x2="16" y2="22"></line>',
    storm: '<path d="M17.5 15H7a4.2 4.2 0 0 1-.6-8.36A6 6 0 0 1 18 5.7 3.8 3.8 0 0 1 17.5 15Z"></path><polyline points="13 14 10 19 12.5 19 11 23"></polyline>'
  };

  function weatherInfo(code) {
    if (code === 0) return { icon: "sun", label: "Céu limpo" };
    if (code === 1 || code === 2) return { icon: "partly", label: "Parcialmente nublado" };
    if (code === 3) return { icon: "cloud", label: "Nublado" };
    if (code === 45 || code === 48) return { icon: "cloud", label: "Neblina" };
    if ([51, 53, 55, 56, 57].includes(code)) return { icon: "rain", label: "Garoa" };
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { icon: "rain", label: "Chuva" };
    if ([95, 96, 99].includes(code)) return { icon: "storm", label: "Tempestade" };
    return { icon: "cloud", label: "Sem dados" };
  }

  function iconSvg(name) {
    return `<svg viewBox="0 0 24 24">${ICONS[name] || ICONS.cloud}</svg>`;
  }

  function weatherCard(dayLabel, code, max, min) {
    const info = weatherInfo(code);
    return `
      <div class="weather-card">
        <p class="weather-day">${dayLabel}</p>
        <div class="weather-icon">${iconSvg(info.icon)}</div>
        <p class="weather-desc">${info.label}</p>
        <p class="weather-temps">${Math.round(max)}&deg;<span class="temp-sep">/</span>${Math.round(min)}&deg;</p>
      </div>`;
  }

  async function loadWeather() {
    const weatherEl = document.getElementById("weather");
    const nowTempEl = document.getElementById("now-temp");
    try {
      const url = "https://api.open-meteo.com/v1/forecast?latitude=-22.9068&longitude=-43.1729"
        + "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min"
        + "&timezone=America%2FSao_Paulo&forecast_days=2";
      const res = await fetch(url);
      if (!res.ok) throw new Error("Falha na resposta da previsão");
      const data = await res.json();

      const currentInfo = weatherInfo(data.current.weather_code);
      nowTempEl.textContent = `· ${Math.round(data.current.temperature_2m)}°C, ${currentInfo.label.toLowerCase()}`;

      weatherEl.innerHTML =
        weatherCard("Hoje", data.daily.weather_code[0], data.daily.temperature_2m_max[0], data.daily.temperature_2m_min[0])
        + '<div class="weather-divider"></div>'
        + weatherCard("Amanhã", data.daily.weather_code[1], data.daily.temperature_2m_max[1], data.daily.temperature_2m_min[1]);
    } catch (err) {
      weatherEl.innerHTML = '<p class="weather-status">Não foi possível carregar a previsão agora.</p>';
    }
  }

  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
</script>

</body>
</html>
